<!DOCTYPE html>
<html lang="en-us">
<head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Unity WebGL Player | Paperly(WebGL)</title>

    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">

    <style>
        @media screen and (orientation: portrait) {
            #rotate-message {
                display: flex;
            }
        }

        #rotate-message {
            display: none;
            position: fixed;
            width: 100%;
            height: 100%;
            background: black;
            color: white;
            justify-content: center;
            align-items: center;
            font-size: 24px;
            z-index: 9999;
        }
    </style>
</head>

<body>

    <div id="rotate-message">
        Tap to rotate to Landscape
    </div>

    <div id="unity-container" class="unity-desktop">
        <canvas id="unity-canvas" width=1280 height=720 tabindex="-1"></canvas>

        <div id="unity-loading-bar">
            <div id="unity-logo"></div>
            <div id="unity-progress-bar-empty">
                <div id="unity-progress-bar-full"></div>
            </div>
        </div>

        <div id="unity-warning"></div>

        <div id="unity-footer">
            <div id="unity-webgl-logo"></div>
            <div id="unity-fullscreen-button"></div>
            <div id="unity-build-title">Paperly(WebGL)</div>
        </div>
    </div>

    <script>
var container = document.querySelector("#unity-container");
var canvas = document.querySelector("#unity-canvas");
var loadingBar = document.querySelector("#unity-loading-bar");
var progressBarFull = document.querySelector("#unity-progress-bar-full");
var fullscreenButton = document.querySelector("#unity-fullscreen-button");
var warningBanner = document.querySelector("#unity-warning");

function unityShowBanner(msg, type) {
    var div = document.createElement('div');
    div.innerHTML = msg;
    warningBanner.appendChild(div);
}

var buildUrl = "Build";
var loaderUrl = buildUrl + "/5.loader.js";

var config = {
    dataUrl: buildUrl + "/5.data",
    frameworkUrl: buildUrl + "/5.framework.js",
    codeUrl: buildUrl + "/5.wasm",
    streamingAssetsUrl: "StreamingAssets",
    companyName: "PlayD Games Studio",
    productName: "Paperly(WebGL)",
    productVersion: "0.1",
    showBanner: unityShowBanner,
};

if (/Android/i.test(navigator.userAgent)) {
    var meta = document.createElement('meta');
    meta.name = 'viewport';
    meta.content = 'width=device-width, height=device-height, initial-scale=1.0, user-scalable=no';
    document.head.appendChild(meta);

    container.className = "unity-mobile";
    canvas.className = "unity-mobile";
}

loadingBar.style.display = "block";

var script = document.createElement("script");
script.src = loaderUrl;

script.onload = () => {
    createUnityInstance(canvas, config, (progress) => {
        progressBarFull.style.width = (100 * progress) + "%";
    }).then((unityInstance) => {

        loadingBar.style.display = "none";

        let locked = false;

        function rotateAndFullscreen() {
            if (locked) return;
            locked = true;

            canvas.requestFullscreen().then(() => {
                if (screen.orientation && screen.orientation.lock) {
                    screen.orientation.lock("landscape").catch(() => {});
                }
            }).catch(() => {});
        }

        // THIS is what rotates the screen
        canvas.addEventListener("touchstart", rotateAndFullscreen, { once: true });
        canvas.addEventListener("click", rotateAndFullscreen, { once: true });

        fullscreenButton.onclick = () => {
            rotateAndFullscreen();
            unityInstance.SetFullscreen(1);
        };

    }).catch(alert);
};

document.body.appendChild(script);
    </script>

</body>
</html>
