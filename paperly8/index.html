<!DOCTYPE html>
<html lang="en-us">
<head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Unity WebGL Player | Paperly(WebGL)</title>

    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">

    <style>
        html, body {
            margin: 0;
            padding: 0;
            background: black;
            overflow: hidden;
        }

        #rotate-message {
            position: fixed;
            width: 100%;
            height: 100%;
            background: black;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 22px;
            z-index: 9999;
            text-align: center;
        }

        /* Hide rotate message in landscape */
        @media screen and (orientation: landscape) {
            #rotate-message {
                display: none;
            }
        }
    </style>
</head>

<body>

    <div id="rotate-message">
        Tap to Start & Rotate to Landscape
    </div>

    <div id="unity-container" class="unity-desktop">
        <canvas id="unity-canvas" width=1920 height=1080 tabindex="-1"></canvas>

        <div id="unity-loading-bar">
            <div id="unity-logo"></div>
            <div id="unity-progress-bar-empty">
                <div id="unity-progress-bar-full"></div>
            </div>
        </div>

        <div id="unity-warning"></div>

        <div id="unity-footer">
            <div id="unity-webgl-logo"></div>
            <div id="unity-fullscreen-button"></div>
            <div id="unity-build-title">Paperly(WebGL)</div>
        </div>
    </div>

    <script>

var container = document.querySelector("#unity-container");
var canvas = document.querySelector("#unity-canvas");
var loadingBar = document.querySelector("#unity-loading-bar");
var progressBarFull = document.querySelector("#unity-progress-bar-full");
var fullscreenButton = document.querySelector("#unity-fullscreen-button");
var warningBanner = document.querySelector("#unity-warning");
var rotateMessage = document.querySelector("#rotate-message");

function unityShowBanner(msg, type) {
    var div = document.createElement("div");
    div.innerHTML = msg;
    warningBanner.appendChild(div);
}

var buildUrl = "Build";
var loaderUrl = buildUrl + "/8.loader.js";

var config = {
    dataUrl: buildUrl + "/8.data",
    frameworkUrl: buildUrl + "/8.framework.js",
    codeUrl: buildUrl + "/8.wasm",
    streamingAssetsUrl: "StreamingAssets",
    companyName: "PlayD Games Studio",
    productName: "Paperly(WebGL)",
    productVersion: "0.1",
    showBanner: unityShowBanner,
};

if (/Android|iPhone|iPad|iPod/i.test(navigator.userAgent)) {
    var meta = document.createElement("meta");
    meta.name = "viewport";
    meta.content = "width=device-width, height=device-height, initial-scale=1.0, user-scalable=no";
    document.head.appendChild(meta);

    container.className = "unity-mobile";
    canvas.className = "unity-mobile";
} else {
    canvas.style.width = "1920px";
    canvas.style.height = "1080px";
}

loadingBar.style.display = "block";

var script = document.createElement("script");
script.src = loaderUrl;

script.onload = () => {

    createUnityInstance(canvas, config, (progress) => {
        progressBarFull.style.width = (100 * progress) + "%";
    }).then((unityInstance) => {

        loadingBar.style.display = "none";

        let hasTriggered = false;

        function rotateAndFullscreen() {

            if (hasTriggered) return;
            hasTriggered = true;

            // Hide overlay immediately
            rotateMessage.style.display = "none";

            // Request fullscreen
            if (!document.fullscreenElement) {
                canvas.requestFullscreen().then(() => {

                    // Lock landscape
                    if (screen.orientation && screen.orientation.lock) {
                        screen.orientation.lock("landscape").catch(() => {});
                    }

                }).catch(() => {});
            }
        }

        // 🔥 IMPORTANT: attach to BOTH overlay AND canvas
        rotateMessage.addEventListener("touchstart", rotateAndFullscreen, { once: true });
        rotateMessage.addEventListener("click", rotateAndFullscreen, { once: true });

        canvas.addEventListener("touchstart", rotateAndFullscreen, { once: true });
        canvas.addEventListener("click", rotateAndFullscreen, { once: true });

        fullscreenButton.onclick = () => {
            rotateAndFullscreen();
            unityInstance.SetFullscreen(1);
        };

    }).catch(alert);
};

document.body.appendChild(script);

    </script>

</body>
</html>
